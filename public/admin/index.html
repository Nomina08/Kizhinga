<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Админка — Кижингинский район</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
      }
      #loading {
        padding: 32px;
        max-width: 520px;
        line-height: 1.6;
        color: #333;
      }
      #loading code {
        background: #e8e8e8;
        padding: 2px 6px;
        border-radius: 4px;
      }
      #error {
        display: none;
        padding: 32px;
        max-width: 520px;
        color: #b91c1c;
        line-height: 1.6;
      }
      .paste-image-zone {
        border: 2px dashed #c4c4c4;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        background: #fafafa;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        outline: none;
      }
      .paste-image-zone:focus,
      .paste-image-zone--active {
        border-color: #1a6b47;
        background: #f0faf5;
      }
      .paste-image-placeholder {
        color: #555;
        line-height: 1.7;
        margin-bottom: 8px;
      }
      .paste-image-hint {
        margin: 12px 0 0;
        font-size: 13px;
        color: #777;
      }
      .paste-image-preview {
        max-width: 100%;
        max-height: 220px;
        border-radius: 8px;
        object-fit: cover;
      }
      .paste-image-file {
        margin-top: 12px;
        font-size: 13px;
      }
      .paste-image-clear {
        margin-top: 10px;
        padding: 6px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      .paste-image-clear:hover {
        border-color: #b91c1c;
        color: #b91c1c;
      }
      .paste-image-error {
        margin-top: 8px;
        color: #b91c1c;
        font-size: 13px;
      }
      .paste-image-url-form {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .paste-image-url-input {
        flex: 1;
        min-width: 180px;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 13px;
      }
      .paste-image-url-btn {
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: #1a6b47;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      .paste-image-url-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <strong>Загрузка админки…</strong>
      <p>
        Если экран остаётся пустым, проверьте:<br />
        1. В отдельном терминале запущено: <code>npm run cms:dev</code><br />
        2. В другом терминале: <code>npm run dev</code><br />
        3. Адрес: <code>/admin/index.html</code>
      </p>
    </div>
    <div id="error"></div>
    <div id="nc-root"></div>

    <script>
      function showError(msg) {
        var loading = document.getElementById('loading');
        var error = document.getElementById('error');
        if (loading) loading.style.display = 'none';
        if (error) {
          error.style.display = 'block';
          error.innerHTML = msg;
        }
      }

      window.addEventListener('error', function (e) {
        showError('<strong>Ошибка JavaScript</strong><p>' + (e.message || 'Не удалось загрузить админку') + '</p>');
      });
    </script>

    <script>window.CMS_MANUAL_INIT = true;</script>

    <script
      src="https://unpkg.com/decap-cms@3.8.0/dist/decap-cms.js"
      onerror="showError('<strong>Не удалось загрузить Decap CMS</strong><p>Проверьте подключение к интернету.</p>');"
    ></script>
    <script src="paste-image.js"></script>
    <script>
      CMS.init();
      var l = document.getElementById('loading');
      if (l) l.style.display = 'none';
    </script>
  </body>
</html>
